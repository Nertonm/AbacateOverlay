[package]
name = "abacate-overlay"
version = "0.1.0"
description = "A Tauri App"
authors = ["nerton"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "abacate_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1.49.0", features = ["full"] } # For asynchronous runtime
xcap = "0.8.1"  # For Screen Capture
image = "0.25.9"  # For image processing

tracing = "0.1" # For application-level tracing
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2" # For log file appending
